name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"        # Har raat 12 baje run
  workflow_dispatch:           # Manually bhi run kar sakte ho
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 🔥 Snake generate karo (pink + dark theme mix)
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pranavop45
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-pink.svg?color_snake=#ff7eb6&color_dots=#0d1117,#5b2a86,#8b5cf6,#c084fc,#ff7eb6

      # 🚀 Push to output branch
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}